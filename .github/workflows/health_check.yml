name: Periodic health check
on:
  schedule:
    - cron: '0 12 * * *' 
  workflow_dispatch:
jobs:
  check_health:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://fso-part11-ci-cd-9nkp.onrender.com/
          max-attempts: 3
          retry-delay: 5s"
